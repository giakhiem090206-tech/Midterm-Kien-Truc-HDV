<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iBanking - Đăng nhập</title>
    <script src="theme.js?v=theme-avatar-2"></script>
    <link rel="stylesheet" href="style.css?v=theme-avatar-2">
</head>
<body>
    <main class="login-screen">
        <section class="login-card">
            <div class="login-art">
                <div class="login-art-label">TDTU · DIGITAL CAMPUS</div>
                <h1>Your campus,<span>your peace of mind.</span></h1>
            </div>
            <div class="login-form-wrap">
                <div class="login-form-inner">
                    <div class="login-brand"><span class="brand-mark" aria-hidden="true"><img src="assets/wallet.svg" alt="" width="28" height="28"></span><span>TDTU</span></div>
                    <h2>Chào mừng trở lại 👋</h2>
                    <p class="login-subtitle">Đăng nhập để tiếp tục thanh toán học phí.</p>
                    <div id="login-error" class="alert alert-error"></div>
                    <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tài khoản" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" id="login-btn" class="btn-primary">Đăng nhập</button>
            </form>
                    <p class="login-footnote">Chưa có đăng ký tài khoản mới.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="common.js?v=theme-avatar-2"></script>
    <script>
        // Đã đăng nhập thì vào thẳng trang thanh toán
        if (getToken()) window.location.href = 'dashboard.html';

        const errorDiv = document.getElementById('login-error');
        const loginBtn = document.getElementById('login-btn');

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            hideAlert(errorDiv);
            loginBtn.disabled = true;
            loginBtn.innerText = 'Đang đăng nhập...';

            try {
                const data = await apiFetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    auth: false,
                    body: {
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    }
                });

                // Lưu JWT, các trang sau gửi kèm token trong header Authorization
                sessionStorage.setItem('token', data.access_token);
                sessionStorage.setItem('HoTen', data.HoTen);
                window.location.href = 'dashboard.html';
            } catch (err) {
                showAlert(errorDiv, err.message);
                loginBtn.disabled = false;
                loginBtn.innerText = 'Đăng nhập';
            }
        });
    </script>
</body>
</html>
