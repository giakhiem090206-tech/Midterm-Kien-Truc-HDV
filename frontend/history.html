<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử giao dịch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">TDTU iBanking</div>
        <div class="user-info">
            Xin chào, <b id="nav-user-name"></b>
            | <a href="tuition.html">Thanh toán học phí</a>
            | <a href="history.html">Lịch sử</a>
            | <a href="#" onclick="logout()">Đăng xuất</a>
        </div>
    </nav>

    <div class="page-container top">
        <div class="banking-card" style="max-width: 850px;">
            <h2>Lịch Sử Giao Dịch</h2>
            <div id="msg-box" class="alert"></div>
            <div class="detail-row">
                <span class="label">Số dư khả dụng hiện tại:</span>
                <span class="value" id="balance">—</span>
            </div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Thời gian</th>
                        <th>Mã giao dịch</th>
                        <th>Sinh viên</th>
                        <th style="text-align: right;">Số tiền</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        const body = document.getElementById('history-body');

        if (requireLogin()) loadHistory();

        async function loadHistory() {
            body.innerHTML = `<tr><td colspan="5" style="text-align: center;">Đang tải...</td></tr>`;
            try {
                const [me, history] = await Promise.all([
                    apiFetch(`${API_BASE}/users/me`),
                    apiFetch(`${API_BASE}/payments`)
                ]);
                document.getElementById('balance').innerText = formatVND(me.available_balance);

                if (history.length === 0) {
                    body.innerHTML = `<tr><td colspan="5" style="text-align: center;">Chưa có giao dịch nào.</td></tr>`;
                    return;
                }

                body.innerHTML = history.map(g => `
                    <tr>
                        <td>${new Date(g.NgayGiaoDich).toLocaleString('vi-VN')}</td>
                        <td title="${escapeHtml(g.MaGiaoDich)}">${escapeHtml(g.MaGiaoDich.slice(0, 14))}…</td>
                        <td>${escapeHtml(g.MSSV)} - ${escapeHtml(g.TenSinhVien)}</td>
                        <td style="text-align: right; font-weight: bold;">${formatVND(g.SoTienGiaoDich)}</td>
                        <td><span class="status-badge status-${g.TrangThai}">${STATUS_LABELS[g.TrangThai] || g.TrangThai}</span></td>
                    </tr>
                `).join('');
            } catch (err) {
                body.innerHTML = '';
                showAlert(document.getElementById('msg-box'), err.message);
            }
        }
    </script>
</body>
</html>
