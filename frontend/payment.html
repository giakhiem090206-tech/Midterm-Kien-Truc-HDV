<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác thực giao dịch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">TDTU iBanking</div>
        <div class="user-info">
            Xin chào, <b id="nav-user-name"></b>
            | <a href="tuition.html">Thanh toán học phí</a>
            | <a href="history.html">Lịch sử</a>
            | <a href="#" onclick="logout()">Đăng xuất</a>
        </div>
    </nav>

    <div class="page-container top">
        <div class="banking-card">
            <h2>Xác Thực Giao Dịch</h2>
            <div id="msg-box" class="alert"></div>

            <div class="section">
                <div class="section-title">Thông tin giao dịch</div>
                <div class="detail-row">
                    <span class="label">Mã giao dịch:</span>
                    <span class="value" id="txnId" style="font-size: 12px;"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Sinh viên:</span>
                    <span class="value" id="student"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Số tiền:</span>
                    <span class="value" id="amount" style="color: var(--error-red); font-size: 18px;"></span>
                </div>
            </div>

            <!-- Bước nhập OTP -->
            <div id="otp-section" style="display: none;">
                <p class="otp-note">✓ Mã OTP đã được gửi đến email <b id="payerEmail"></b></p>
                <div class="countdown">Mã OTP hết hạn sau <b id="countdown">05:00</b></div>
                <div class="form-group">
                    <input type="text" id="otpCode" class="form-control otp-input" maxlength="6"
                           inputmode="numeric" autocomplete="one-time-code" placeholder="••••••">
                </div>
                <button id="confirmBtn" class="btn-primary" disabled>Xác nhận thanh toán</button>
            </div>

            <!-- Kết quả giao dịch -->
            <div id="result-section" class="result" style="display: none;">
                <div class="result-icon" id="result-icon"></div>
                <h3 id="result-title"></h3>
                <p id="result-text"></p>
                <div id="result-balance" class="detail-row" style="display: none;">
                    <span class="label">Số dư còn lại:</span>
                    <span class="value" id="new-balance"></span>
                </div>
                <button class="btn-primary" onclick="location.href='history.html'">Xem lịch sử giao dịch</button>
                <button class="btn-secondary" onclick="location.href='tuition.html'">Thanh toán khoản khác</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        const txnId = new URLSearchParams(window.location.search).get('txn');
        const msgBox = document.getElementById('msg-box');
        const otpInput = document.getElementById('otpCode');
        const confirmBtn = document.getElementById('confirmBtn');
        let countdownTimer = null;

        if (requireLogin()) init();

        async function init() {
            if (!txnId) {
                window.location.href = 'tuition.html';
                return;
            }

            otpInput.addEventListener('input', () => {
                otpInput.value = otpInput.value.replace(/\D/g, '');
                confirmBtn.disabled = otpInput.value.length !== 6;
            });
            otpInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !confirmBtn.disabled) confirmPayment();
            });
            confirmBtn.addEventListener('click', confirmPayment);

            try {
                const [gd, me] = await Promise.all([
                    apiFetch(`${API_BASE}/payments/${encodeURIComponent(txnId)}`),
                    apiFetch(`${API_BASE}/users/me`)
                ]);
                document.getElementById('txnId').innerText = gd.MaGiaoDich;
                document.getElementById('student').innerText = `${gd.MSSV} - ${gd.TenSinhVien}`;
                document.getElementById('amount').innerText = formatVND(gd.SoTienGiaoDich);
                document.getElementById('payerEmail').innerText = me.email;

                if (gd.TrangThai === 'PENDING') {
                    document.getElementById('otp-section').style.display = 'block';
                    startCountdown(gd.otp_expires_at);
                    otpInput.focus();
                } else if (gd.TrangThai === 'SUCCESS') {
                    showResult(true, 'Giao dịch này đã được thanh toán thành công.');
                } else if (gd.TrangThai === 'PROCESSING') {
                    document.getElementById('result-section').style.display = 'block';
                    document.getElementById('result-title').innerText = 'Đang khôi phục giao dịch';
                    document.getElementById('result-text').innerText = 'Vui lòng chờ trong khi hệ thống kiểm tra kết quả thanh toán.';
                    pollRecovery();
                } else {
                    showResult(false, 'Giao dịch không thành công hoặc mã OTP đã hết hạn.');
                }
            } catch (err) {
                showAlert(msgBox, err.message);
            }
        }

        function startCountdown(expiresAt) {
            const end = new Date(expiresAt).getTime();
            const tick = () => {
                const left = Math.max(0, Math.floor((end - Date.now()) / 1000));
                const mm = String(Math.floor(left / 60)).padStart(2, '0');
                const ss = String(left % 60).padStart(2, '0');
                document.getElementById('countdown').innerText = `${mm}:${ss}`;
                if (left === 0) {
                    clearInterval(countdownTimer);
                    showResult(false, 'Mã OTP đã hết hạn. Vui lòng tạo giao dịch mới.');
                }
            };
            tick();
            countdownTimer = setInterval(tick, 1000);
        }

        async function confirmPayment() {
            hideAlert(msgBox);
            confirmBtn.disabled = true;
            confirmBtn.innerText = 'Đang xử lý...';

            try {
                const data = await apiFetch(`${API_BASE}/payments/${encodeURIComponent(txnId)}/confirm`, {
                    method: 'POST',
                    body: { otp: otpInput.value }
                });
                showResult(true, 'Học phí đã được thanh toán. Email xác nhận đã được gửi đến hộp thư của bạn.', data.new_balance);
            } catch (err) {
                // Kiểm tra lại trạng thái: còn PENDING (sai OTP, còn lượt) thì cho nhập lại,
                // ngược lại giao dịch đã kết thúc -> hiển thị kết quả thất bại
                let stillPending = false;
                let currentStatus = null;
                try {
                    const gd = await apiFetch(`${API_BASE}/payments/${encodeURIComponent(txnId)}`);
                    stillPending = gd.TrangThai === 'PENDING';
                    currentStatus = gd.TrangThai;
                } catch (e) { /* bỏ qua, hiển thị lỗi gốc */ }

                if (stillPending) {
                    showAlert(msgBox, err.message);
                    otpInput.value = '';
                    otpInput.focus();
                    confirmBtn.innerText = 'Xác nhận thanh toán';
                } else if (currentStatus === 'PROCESSING') {
                    showAlert(msgBox, 'Giao dịch đang chờ service khôi phục. Trang sẽ tự cập nhật kết quả.');
                    pollRecovery();
                } else {
                    showResult(false, err.message);
                }
            }
        }

        async function pollRecovery() {
            try {
                const gd = await apiFetch(`${API_BASE}/payments/${encodeURIComponent(txnId)}`);
                if (gd.TrangThai === 'SUCCESS') {
                    showResult(true, 'Giao dịch đã được xử lý thành công.');
                    return;
                }
                if (gd.TrangThai === 'FAILED') {
                    showResult(false, 'Giao dịch không thành công. Vui lòng kiểm tra lịch sử giao dịch.');
                    return;
                }
            } catch (e) {
                showAlert(msgBox, e.message);
            }
            setTimeout(pollRecovery, 2000);
        }

        function showResult(success, text, newBalance) {
            clearInterval(countdownTimer);
            hideAlert(msgBox);
            document.getElementById('otp-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            document.getElementById('result-icon').innerText = success ? '✅' : '❌';
            document.getElementById('result-title').innerText = success ? 'Thanh toán thành công' : 'Giao dịch không thành công';
            document.getElementById('result-title').style.color = success ? 'var(--success-green)' : 'var(--error-red)';
            document.getElementById('result-text').innerText = text;
            if (newBalance !== undefined) {
                document.getElementById('result-balance').style.display = 'flex';
                document.getElementById('new-balance').innerText = formatVND(newBalance);
            }
        }
    </script>
</body>
</html>
