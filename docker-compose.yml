services:
  db:
    image: postgres:15-alpine
    container_name: ibanking-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: ibanking
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ibanking"]
      interval: 3s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./backend/auth_service
    container_name: ibanking-auth-service
    ports:
      - "8001:8001"
    volumes:
      - ./backend/auth_service:/app
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/ibanking
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tuition-service:
    build: ./backend/tuition_service
    container_name: ibanking-tuition-service
    ports:
      - "8002:8002"
    volumes:
      - ./backend/tuition_service:/app
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/ibanking
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build: ./backend/payment_service
    container_name: ibanking-payment-service
    ports:
      - "8003:8003"
    volumes:
      - ./backend/payment_service:/app
      - ./test_concurrency.py:/app/test_concurrency.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/ibanking
      - AUTH_SERVICE_URL=http://auth-service:8001
      - TUITION_SERVICE_URL=http://tuition-service:8002
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-giaphucnguyen36573@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-permvvkdsjxvmsqr}
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
      tuition-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: ibanking-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - auth-service
      - tuition-service
      - payment-service
    restart: unless-stopped
