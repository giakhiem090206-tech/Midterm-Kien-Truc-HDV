
# Cổng vào duy nhất: API Gateway http://localhost (giao diện web + /api/v1/...).
# Các service và database chỉ giao tiếp trong mạng Docker, không mở port ra máy host.
# Cần gọi thẳng service để debug: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  # Một PostgreSQL instance chứa các database riêng theo từng service.
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./database/auth/init.sql:/docker-entrypoint-initdb.d/10-auth.sql:ro
      - ./database/tuition/init.sql:/docker-entrypoint-initdb.d/20-tuition.sql:ro
      - ./database/payment/init.sql:/docker-entrypoint-initdb.d/30-payment.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -U root -d auth_db -tAc "SELECT to_regclass('public.\"NguoiDung\"') IS NOT NULL" | grep -qx t &&
          psql -U root -d tuition_db -tAc "SELECT to_regclass('public.\"HocPhi\"') IS NOT NULL" | grep -qx t &&
          psql -U root -d payment_db -tAc "SELECT to_regclass('public.\"GiaoDich\"') IS NOT NULL" | grep -qx t
      interval: 3s
      timeout: 3s
      retries: 20

  # Build từ thư mục backend/ để mỗi service chép được module dùng chung backend/shared
  auth-service:
    build:
      context: ./backend
      dockerfile: auth_service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/auth_db
      - JWT_SECRET=${JWT_SECRET:-ibanking-dev-jwt-secret-change-me-0123456789}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-ibanking-dev-internal-key}
    depends_on:
      db:
        condition: service_healthy

  tuition-service:
    build:
      context: ./backend
      dockerfile: tuition_service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/tuition_db
      - JWT_SECRET=${JWT_SECRET:-ibanking-dev-jwt-secret-change-me-0123456789}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-ibanking-dev-internal-key}
    depends_on:
      db:
        condition: service_healthy

  payment-service:
    build:
      context: ./backend
      dockerfile: payment_service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/payment_db
      - JWT_SECRET=${JWT_SECRET:-ibanking-dev-jwt-secret-change-me-0123456789}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-ibanking-dev-internal-key}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - TUITION_SERVICE_URL=http://tuition-service:8002
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
      tuition-service:
        condition: service_started
      notification-service:
        condition: service_started

  # Gửi OTP và biên lai qua Gmail SMTP; thông tin xác thực lấy từ .env
  notification-service:
    build:
      context: ./backend
      dockerfile: notification_service/Dockerfile
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-ibanking-dev-internal-key}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - MAIL_FROM=${MAIL_FROM:-}

  # API Gateway (Nginx): phục vụ giao diện web và định tuyến /api/v1/... tới các service
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - tuition-service
      - payment-service

volumes:
  postgres-data:
