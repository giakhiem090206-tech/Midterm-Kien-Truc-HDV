
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format gateway '$time_local rid=$req_id "$request" $status $body_bytes_sent '
                   'upstream=$upstream_addr time=${request_time}s';

server {
    listen 80;
    access_log /var/log/nginx/access.log gateway;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_service    http://auth-service:8001;
    set $tuition_service http://tuition-service:8002;
    set $payment_service http://payment-service:8003;

    root /usr/share/nginx/html;
    index login.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    charset utf-8;
    charset_types application/json;

    location /api/v1/auth/ {
        proxy_pass $auth_service;
    }
    location = /api/v1/users/me {
        proxy_pass $auth_service;
    }

    location ^~ /api/v1/tuitions/detail/ {
        default_type application/json;
        return 404 '{"detail": "Không tìm thấy API"}';
    }
    location ~ ^/api/v1/tuitions/[^/]+/pay$ {
        default_type application/json;
        return 404 '{"detail": "Không tìm thấy API"}';
    }
    location /api/v1/tuitions/ {
        proxy_pass $tuition_service;
    }

    location /api/v1/payments {
        proxy_pass $payment_service;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"detail": "Không tìm thấy API"}';
    }

    error_page 502 503 504 = @service_unavailable;
    location @service_unavailable {
        default_type application/json;
        return 503 '{"detail": "Dịch vụ tạm thời không phản hồi, vui lòng thử lại sau"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
