<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>iBanking - Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="banking-card">
            <h2>TDTU iBanking</h2>
            <div id="login-error" class="alert alert-error" style="display: none;"></div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tài khoản" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Đăng nhập</button>
            </form>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');

            errorDiv.style.display = "none";

            try {
                const res = await fetch('http://localhost:8001/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Sửa lại đúng tên field username và password
                    body: JSON.stringify({ 
                        username: username, 
                        password: password 
                    })
                });

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    // Xử lý thông báo lỗi an toàn, tránh bị hiện [object Object]
                    let message = "Sai Tên đăng nhập hoặc Mật khẩu!";
                    if (typeof data.detail === 'string') {
                        message = data.detail;
                    }
                    
                    errorDiv.innerText = message;
                    errorDiv.style.display = "block";
                    return;
                }
                
                // Lưu Session (kiểm tra cả key viết hoa lẫn viết thường từ backend)
                sessionStorage.setItem('token', data.token || '');
                sessionStorage.setItem('MaNguoiDung', data.MaNguoiDung || data.id || data.user_id);
                sessionStorage.setItem('HoTenNguoiNop', data.HoTen || data.full_name || username);

                // Chuyển hướng sang trang tra cứu học phí
                window.location.href = 'tuition.html';
            } catch (err) {
                console.error(err);
                errorDiv.innerText = "Lỗi kết nối tới Auth Service (Port 8001)!";
                errorDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
