<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDTU iBanking - Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="page-container">
        <div class="banking-card">
            <h2>TDTU iBanking</h2>
            <p class="subtitle">Phân hệ Thanh toán Học phí Sinh viên</p>
            <div id="login-error" class="alert alert-error" style="display: none;"></div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập hoặc MSSV" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Đăng nhập</button>
            </form>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');

            errorDiv.style.display = "none";

            try {
                const res = await fetch('http://localhost:8001/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    let message = "Sai tên đăng nhập hoặc mật khẩu!";
                    if (typeof data.detail === 'string') {
                        message = data.detail;
                    }
                    errorDiv.innerText = message;
                    errorDiv.style.display = "block";
                    return;
                }

                // Email tài khoản lấy theo <MSSV>@student.tdtu.edu.vn
                const mssv = data.MSSV || '';
                const studentEmail = mssv ? `${mssv.toUpperCase()}@student.tdtu.edu.vn` : (data.Email || '');

                sessionStorage.setItem('token', data.access_token || '');
                sessionStorage.setItem('MaNguoiDung', data.MaNguoiDung);
                sessionStorage.setItem('MSSVNguoiNop', mssv);
                sessionStorage.setItem('HoTenNguoiNop', data.HoTen || username);
                sessionStorage.setItem('SoDienThoaiNguoiNop', data.SoDienThoai || '');
                sessionStorage.setItem('EmailNguoiNop', studentEmail);
                sessionStorage.setItem('SoDuKhaDung', data.SoDuKhaDung ?? 0);

                window.location.href = 'tuition.html';
            } catch (err) {
                console.error(err);
                errorDiv.innerText = "Lỗi kết nối tới Auth Service (Port 8001)!";
                errorDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
