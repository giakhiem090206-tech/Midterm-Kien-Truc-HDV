<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>iBanking - Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="banking-card">
            <h2>TDTU iBanking</h2>
            <div id="login-error" class="alert alert-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tài khoản" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" id="login-btn" class="btn-primary">Đăng nhập</button>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // Đã đăng nhập thì vào thẳng trang thanh toán
        if (getToken()) window.location.href = 'tuition.html';

        const errorDiv = document.getElementById('login-error');
        const loginBtn = document.getElementById('login-btn');

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            hideAlert(errorDiv);
            loginBtn.disabled = true;
            loginBtn.innerText = 'Đang đăng nhập...';

            try {
                const data = await apiFetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    auth: false,
                    body: {
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    }
                });

                // Lưu JWT, các trang sau gửi kèm token trong header Authorization
                sessionStorage.setItem('token', data.access_token);
                sessionStorage.setItem('HoTen', data.HoTen);
                window.location.href = 'tuition.html';
            } catch (err) {
                showAlert(errorDiv, err.message);
                loginBtn.disabled = false;
                loginBtn.innerText = 'Đăng nhập';
            }
        });
    </script>
</body>
</html>
